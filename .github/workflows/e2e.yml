name: Neon Data API E2E

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  neon-data-api:
    runs-on: ubuntu-latest
    env:
      NEON_DATA_API_URL: ${{ secrets.NEON_DATA_API_URL }}
      NEON_AUTH_BASE_URL: ${{ secrets.NEON_AUTH_BASE_URL }}
      NEON_DATA_API_ANON_TOKEN: ${{ secrets.NEON_DATA_API_ANON_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -e .

      - name: Run Neon Data API E2E
        run: python -m pytest tests/e2e -q
